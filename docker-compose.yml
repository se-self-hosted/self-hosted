services:
  app:
    build:
      context: .
    image: nextjs-dev
    ports:
      - "3000:3000"
      - "5555:5555"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      # Uncomment the following line if hot-reloading doesn't work (e.g., on Windows/WSL)
      # WATCHPACK_POLLING: "true"
    depends_on:
      - postgres
      - redis
      - minio
      - livekit

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: meeting_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  livekit:
    image: livekit/livekit-server:latest
    command: --dev
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

  coturn:
    image: coturn/coturn
    command: >
      -n --log-file=stdout --min-port=49152 --max-port=65535
      --realm=turn.example.com --user=user:password
    ports:
      - "3478:3478"
      - "3478:3478/udp"

volumes:
  postgres_data:
  redis_data:
  minio_data: