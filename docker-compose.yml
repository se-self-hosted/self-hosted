services:
  app:
    build:
      context: .
    image: nextjs-dev
    ports:
      - "3000:3000"
      - "5555:5556"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      # Uncomment the following line if hot-reloading doesn't work (e.g., on Windows/WSL)
      # WATCHPACK_POLLING: "true"
    depends_on:
      - postgres
      - redis
      - minio
      - livekit

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: meeting_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0 --node-ip 172.20.10.5
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

  coturn:
    image: coturn/coturn:latest
    container_name: coturn
    restart: unless-stopped
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "5349:5349"
      - "5349:5349/udp"
      - "49152-49200:49152-49200/udp"
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    environment:
      TURN_USER: ${TURN_USER:-meetuser}
      TURN_PASSWORD: ${TURN_PASSWORD:-meetsync-turn-secret}
      TURN_REALM: ${TURN_REALM:-turn.meetsync.local}
    command: ["-c", "/etc/coturn/turnserver.conf"]

volumes:
  postgres_data:
  redis_data:
  minio_data: