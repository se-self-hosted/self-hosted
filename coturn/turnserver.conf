# Coturn Configuration for Web-based Real-time Voice Meeting Platform

# Listening ports
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

# External IP configuration (auto or explicit override)
# external-ip=YOUR_PUBLIC_IP

# WebRTC and Authentication Mechanism
fingerprint
lt-cred-mech
realm=turn.meetsync.local

# Default user credential (matches .env defaults)
user=meetuser:meetsync-turn-secret

# Dynamic port range for UDP media relay
min-port=49152
max-port=65535

# Logging and security
log-file=stdout
no-cli
no-loopback-peers
no-multicast-peers
