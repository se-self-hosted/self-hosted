# Coturn configuration for the voice meeting platform.
#
# The realm, user and external IP come from .env through the command line in
# docker-compose.yml. LiveKit hands the same host and credentials to every
# participant (rtc.turn_servers), so clients behind strict NATs or
# firewalls can still reach the SFU through this relay.

# Listens on every interface by default. Don't set listening-ip=0.0.0.0:
# coturn then refuses to relay to the host's own IP, i.e. to LiveKit.
listening-port=3478

# Relay ports: must equal the range published in docker-compose.yml, or
# relays on unpublished ports silently fail. 100 ports ~ 100 relayed clients.
min-port=49152
max-port=49251

fingerprint
lt-cred-mech

# Plain TURN over UDP/TCP 3478 only: media is already encrypted end to end
# by WebRTC (DTLS-SRTP). TURN over TLS needs a certificate; see README.
no-tls

log-file=stdout
# Loopback peers and the admin CLI are off by default in coturn 4.6+.
no-multicast-peers
