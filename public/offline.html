<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ออฟไลน์ · MeetSync</title>
  <style>
    :root { color-scheme: light dark; --paper: #f4f2ec; --ink: #1b1d1c; --soft: #55595a; --accent: #d4f36b; }
    @media (prefers-color-scheme: dark) { :root { --paper: #141614; --ink: #f2f0e8; --soft: #c9cec8; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink);
      font-family: "IBM Plex Sans Thai", system-ui, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
    img { width: 72px; height: 72px; }
    h1 { font-size: 1.25rem; margin: 16px 0 8px; }
    p { margin: 0 0 20px; color: var(--soft); line-height: 1.6; }
    button { font: inherit; border: 0; border-radius: 999px; padding: 10px 20px; background: var(--accent); color: #18211e; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>ไม่มีการเชื่อมต่ออินเทอร์เน็ต</h1>
    <p>การประชุมด้วยเสียงต้องใช้อินเทอร์เน็ต<br>เมื่อกลับมาออนไลน์แล้ว กดลองใหม่ได้เลย</p>
    <button type="button" onclick="location.reload()">ลองใหม่</button>
  </main>
</body>
</html>
